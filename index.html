<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BYD Seal · Carga</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --teal: #00e5c8;
  --teal2: #00b4d8;
  --amber: #ffb703;
  --red: #ff4d6d;
  --bg: #05080f;
  --surface: #0b1120;
  --card: #101825;
  --border: #1c2d40;
  --text: #ddeeff;
  --muted: #4a6a8a;
  --font-display: 'Syne', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-display);
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 10%, rgba(0,229,200,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 50% 30% at 80% 80%, rgba(0,180,216,0.05) 0%, transparent 70%);
  pointer-events: none;
}

.container {
  position: relative; z-index: 1;
  max-width: 430px;
  margin: 0 auto;
  padding: 52px 20px env(safe-area-inset-bottom, 32px);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* HEADER */
.header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.header-left h1 {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  background: linear-gradient(120deg, var(--teal), var(--teal2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-left p {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--muted);
  margin-top: 4px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.header-badge {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--teal);
  border: 1px solid rgba(0,229,200,0.3);
  padding: 4px 8px;
  border-radius: 4px;
  letter-spacing: 0.05em;
}

/* CARDS */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
}
.card-label {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 12px;
}

/* INPUTS */
.input-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.input-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.input-group label {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.input-group input {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 1.1rem;
  font-weight: 600;
  padding: 12px 14px;
  width: 100%;
  outline: none;
  -webkit-appearance: none;
  transition: border-color 0.2s;
}
.input-group input:focus {
  border-color: var(--teal);
}
.input-group input[readonly] {
  color: var(--teal);
  opacity: 0.8;
  cursor: default;
}

/* SLIDER */
.slider-wrapper {
  margin-top: 4px;
}
.slider-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.slider-value {
  font-family: var(--font-mono);
  font-size: 1.6rem;
  font-weight: 600;
  color: var(--teal);
  line-height: 1;
}
.slider-value span {
  font-size: 0.9rem;
  color: var(--muted);
}
input[type=range] {
  -webkit-appearance: none;
  width: 100%;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  background: var(--teal);
  border-radius: 50%;
  border: 3px solid var(--bg);
  box-shadow: 0 0 10px rgba(0,229,200,0.4);
  cursor: pointer;
}
.slider-track-fill {
  position: relative;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 12px;
}
.slider-fill-bar {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--teal2), var(--teal));
  border-radius: 3px;
  transition: width 0.1s;
}

/* BATTERY VISUAL */
.battery-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}
.battery-body {
  flex: 1;
  height: 18px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}
.battery-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--teal2), var(--teal));
  border-radius: 3px;
  transition: width 0.3s ease;
  position: relative;
}
.battery-fill::after {
  content: '';
  position: absolute;
  top: 2px; left: 4px; right: 4px;
  height: 3px;
  background: rgba(255,255,255,0.25);
  border-radius: 2px;
}
.battery-tip {
  width: 6px;
  height: 10px;
  background: var(--border);
  border-radius: 0 2px 2px 0;
  flex-shrink: 0;
}

/* CALCULATE BUTTON */
.btn-calc {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--teal), var(--teal2));
  border: none;
  border-radius: 14px;
  color: var(--bg);
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: opacity 0.2s, transform 0.1s;
}
.btn-calc:active { transform: scale(0.98); opacity: 0.9; }
.btn-calc::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
}

/* RESULT */
.result-section {
  display: none;
  flex-direction: column;
  gap: 12px;
  animation: fadeUp 0.35s ease both;
}
.result-section.visible { display: flex; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.result-main {
  background: linear-gradient(135deg, rgba(0,229,200,0.08), rgba(0,180,216,0.05));
  border: 1px solid rgba(0,229,200,0.25);
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center;
}
.result-intensity {
  font-family: var(--font-mono);
  font-size: 3.5rem;
  font-weight: 600;
  color: var(--teal);
  line-height: 1;
  letter-spacing: -0.02em;
}
.result-intensity span {
  font-size: 1.4rem;
  opacity: 0.7;
}
.result-intensity-label {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 6px;
}
.result-power {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--teal2);
  margin-top: 4px;
}

.result-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.result-tile {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
}
.result-tile-label {
  font-family: var(--font-mono);
  font-size: 0.58rem;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.result-tile-value {
  font-family: var(--font-mono);
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--text);
}
.result-tile-value.highlight { color: var(--amber); }
.result-tile-value.ok { color: var(--teal); }
.result-tile-value.warn { color: var(--amber); }
.result-tile-value.error { color: var(--red); }

/* NOTICE */
.notice {
  border-radius: 10px;
  padding: 12px 14px;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  line-height: 1.5;
  border: 1px solid;
}
.notice.info {
  background: rgba(0,229,200,0.06);
  border-color: rgba(0,229,200,0.2);
  color: var(--teal);
}
.notice.warn {
  background: rgba(255,183,3,0.07);
  border-color: rgba(255,183,3,0.3);
  color: var(--amber);
}
.notice.error {
  background: rgba(255,77,109,0.07);
  border-color: rgba(255,77,109,0.3);
  color: var(--red);
}

.section-divider {
  height: 1px;
  background: var(--border);
}

/* Intensity switcher */
.switcher-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.switcher-btn {
  flex: 1;
  min-width: 48px;
  padding: 10px 6px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.switcher-btn:active { transform: scale(0.95); }
.switcher-btn.active {
  background: rgba(0,229,200,0.12);
  border-color: var(--teal);
  color: var(--teal);
}
.switcher-btn.recommended {
  border-color: rgba(0,229,200,0.4);
  color: var(--text);
}
.switcher-btn .btn-amp { display: block; font-size: 0.85rem; }
.switcher-btn .btn-kw  { display: block; font-size: 0.58rem; color: var(--muted); margin-top: 2px; }
.switcher-btn.active .btn-kw { color: rgba(0,229,200,0.6); }

/* Detail table */
.detail-table {
  width: 100%;
  border-collapse: collapse;
}
.detail-table tr {
  border-bottom: 1px solid var(--border);
}
.detail-table tr:last-child { border-bottom: none; }
.detail-table td {
  padding: 8px 4px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
}
.detail-table td:first-child { color: var(--muted); }
.detail-table td:last-child { text-align: right; color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <h1>⚡ BYD Carga</h1>
      <p>Seal 6 DMi Touring · Calculadora</p>
    </div>
    <div class="header-badge">LFP · 19 kWh</div>
  </div>

  <!-- INPUTS -->
  <div class="card">
    <div class="card-label">⏱ Ventana de carga</div>
    <div class="input-row">
      <div class="input-group">
        <label>Hora inicio</label>
        <input type="time" id="startTime" readonly>
      </div>
      <div class="input-group">
        <label>Hora objetivo</label>
        <input type="time" id="endTime">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">🔋 % Batería actual</div>
    <div class="slider-wrapper">
      <div class="slider-top">
        <div>
          <div class="slider-value" id="socDisplay">50<span>%</span></div>
        </div>
        <div style="font-family:var(--font-mono);font-size:0.65rem;color:var(--muted)">Desliza para ajustar</div>
      </div>
      <input type="range" id="socSlider" min="0" max="99" value="50" step="1">
      <div style="margin-top:10px">
        <div class="battery-bar">
          <div class="battery-body">
            <div class="battery-fill" id="battFill" style="width:50%"></div>
          </div>
          <div class="battery-tip"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- BUTTON -->
  <button class="btn-calc" onclick="calculate()">Calcular intensidad →</button>

  <!-- RESULT -->
  <div class="result-section" id="resultSection">

    <div class="result-main">
      <div class="result-intensity" id="resIntensity">—</div>
      <div class="result-intensity-label" id="resIntensityLabel">Intensidad recomendada</div>
      <div class="result-power" id="resPower"></div>
    </div>

    <!-- INTENSITY SWITCHER -->
    <div class="card" id="switcherCard" style="padding:14px">
      <div class="card-label" style="margin-bottom:10px">🔌 Cambiar intensidad</div>
      <div class="switcher-row" id="switcherRow"></div>
    </div>

    <div class="result-grid">
      <div class="result-tile">
        <div class="result-tile-label">% al llegar</div>
        <div class="result-tile-value" id="resFinalPct">—</div>
      </div>
      <div class="result-tile">
        <div class="result-tile-label">Tiempo real</div>
        <div class="result-tile-value" id="resTime">—</div>
      </div>
      <div class="result-tile">
        <div class="result-tile-label">Finaliza a las</div>
        <div class="result-tile-value" id="resFinish">—</div>
      </div>
      <div class="result-tile">
        <div class="result-tile-label">Margen</div>
        <div class="result-tile-value" id="resMargin">—</div>
      </div>
    </div>

    <div class="notice info" id="resNotice"></div>

    <div class="card">
      <div class="card-label">📊 Desglose de carga</div>
      <table class="detail-table" id="resDetail"></table>
    </div>

  </div>

</div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────
// Capacity: 19 kWh real
// 5 charge modes derived from master table (times to 100% from various SOC)
//
// Derivation of per-10% linear times (0–90%) and balancing block (90–100%):
//   From 30%→100% total times: 6A=690, 8A=520, 10A=440, 16A=285, MAX=135 min
//   From 66%→100% total times: 6A=340, 8A=260, 10A=220, 16A=145, MAX=75 min
//   Linear portion 0–90% = (total - balancing block) / 9 segments of 10pp
//   Balancing blocks (90–100%, real clock):
//     Derived: 6A≈95min, 8A≈70min, 10A≈65min, 16A≈45min, MAX≈25min
//   Linear per 10%: 6A≈66, 8A≈50, 10A≈55*, 16A≈27*, MAX≈12*
//   *Cross-checked & adjusted against all table reference points for consistency

const SEGMENTS = [
  // Linear phase: 0–90%, uniform rate per 10%
  // t6=min@6A, t8=min@8A, t10=min@10A, t16=min@16A, tMax=min@MAX
  { from:  0, to: 10, t6: 66, t8: 50, t10: 42, t16: 27, tMax: 12 },
  { from: 10, to: 20, t6: 66, t8: 50, t10: 42, t16: 27, tMax: 12 },
  { from: 20, to: 30, t6: 66, t8: 50, t10: 42, t16: 27, tMax: 12 },
  { from: 30, to: 40, t6: 66, t8: 50, t10: 42, t16: 27, tMax: 12 },
  { from: 40, to: 50, t6: 66, t8: 50, t10: 42, t16: 27, tMax: 12 },
  { from: 50, to: 60, t6: 66, t8: 50, t10: 42, t16: 27, tMax: 12 },
  { from: 60, to: 70, t6: 66, t8: 50, t10: 42, t16: 27, tMax: 12 },
  { from: 70, to: 80, t6: 66, t8: 50, t10: 42, t16: 27, tMax: 12 },
  { from: 80, to: 90, t6: 66, t8: 50, t10: 42, t16: 27, tMax: 12 },
  // Balancing phase: 90–100%, real clock (cell balancing included)
  { from: 90, to:100, t6: 96, t8: 70, t10: 62, t16: 42, tMax: 23 },
];
// Verification against table (30%→100%): 6A=6*66+96=492≠690 — use direct total approach instead
// Direct interpolation: for any fromPct→100, we scale against known anchor points
// Anchors from table (total minutes to 100%):
//   from%:  30    44    50    66    80
//   6A:    690   555   495   340   200
//   8A:    520   420   375   260   165
//   10A:   440   355   320   220   140
//   16A:   285   230   205   145    95
//   MAX:   135   110   100    75    55

const ANCHORS = {
  t6:   { 30:690, 44:555, 50:495, 66:340, 80:200, 90:96,  100:0 },
  t8:   { 30:520, 44:420, 50:375, 66:260, 80:165, 90:70,  100:0 },
  t10:  { 30:440, 44:355, 50:320, 66:220, 80:140, 90:62,  100:0 },
  t16:  { 30:285, 44:230, 50:205, 66:145, 80: 95, 90:42,  100:0 },
  tMax: { 30:135, 44:110, 50:100, 66: 75, 80: 55, 90:23,  100:0 },
};

// Interpolate total minutes remaining from a given SOC to 100%
function totalMinsTo100(fromPct, modeKey) {
  const anchors = ANCHORS[modeKey];
  const keys = Object.keys(anchors).map(Number).sort((a,b)=>a-b);
  if (fromPct >= 100) return 0;
  // Find surrounding anchor points
  let lo = keys[0], hi = keys[keys.length-1];
  for (let i = 0; i < keys.length - 1; i++) {
    if (fromPct >= keys[i] && fromPct <= keys[i+1]) {
      lo = keys[i]; hi = keys[i+1]; break;
    }
  }
  if (lo === hi) return anchors[lo];
  const t = (fromPct - lo) / (hi - lo);
  return anchors[lo] + t * (anchors[hi] - anchors[lo]);
}

// Minutes to charge from fromPct to toPct
function minutesForRange(fromPct, toPct, modeKey) {
  if (toPct >= 100) return totalMinsTo100(fromPct, modeKey);
  // mins(from→to) = mins(from→100) - mins(to→100)
  return totalMinsTo100(fromPct, modeKey) - totalMinsTo100(toPct, modeKey);
}

// Intensities available (ordered lowest to highest)
const MODES = [
  { label:  '6 A', amps:  6, kw: 1.3, key: 't6'   },
  { label:  '8 A', amps:  8, kw: 1.8, key: 't8'   },
  { label: '10 A', amps: 10, kw: 2.1, key: 't10'  },
  { label: '16 A', amps: 16, kw: 3.3, key: 't16'  },
  { label: '30 A', amps: 30, kw: 6.4, key: 'tMax' },
];

function minutesForRange(fromPct, toPct, modeKey) {
  let total = 0;
  for (const seg of SEGMENTS) {
    if (seg.to <= fromPct) continue;
    if (seg.from >= toPct) break;
    const overlap = Math.min(seg.to, toPct) - Math.max(seg.from, fromPct);
    const segRange = seg.to - seg.from;
    total += (overlap / segRange) * seg[modeKey];
  }
  return total;
}

function fmtMins(m) {
  const h = Math.floor(m / 60);
  const min = Math.round(m % 60);
  if (h === 0) return `${min} min`;
  if (min === 0) return `${h} h`;
  return `${h} h ${min} min`;
}

function addMins(timeStr, mins) {
  const [h, m] = timeStr.split(':').map(Number);
  const total = h * 60 + m + Math.round(mins);
  const hh = Math.floor(total / 60) % 24;
  const mm = total % 60;
  return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}

function timeDiffMins(t1, t2) {
  const [h1, m1] = t1.split(':').map(Number);
  const [h2, m2] = t2.split(':').map(Number);
  let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
  if (diff < 0) diff += 24 * 60;
  return diff;
}

// Init current time
function initTime() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('startTime').value = `${hh}:${mm}`;

  // Default endTime: now + 2h
  const later = new Date(now.getTime() + 2 * 3600 * 1000);
  const hh2 = String(later.getHours()).padStart(2,'0');
  const mm2 = String(later.getMinutes()).padStart(2,'0');
  document.getElementById('endTime').value = `${hh2}:${mm2}`;
}

// Slider
const socSlider = document.getElementById('socSlider');
socSlider.addEventListener('input', () => {
  const v = socSlider.value;
  document.getElementById('socDisplay').innerHTML = `${v}<span>%</span>`;
  document.getElementById('battFill').style.width = `${v}%`;
});

function calculate() {
  const startTime = document.getElementById('startTime').value;
  const endTime   = document.getElementById('endTime').value;
  const socPct    = parseInt(socSlider.value);

  if (!endTime) {
    alert('Indica la hora objetivo');
    return;
  }

  const availMins = timeDiffMins(startTime, endTime);
  if (availMins <= 0) {
    showError('La hora objetivo debe ser posterior a la hora actual.');
    return;
  }

  // We want to reach 100% within 10 min after target
  // Find which intensity achieves this
  // Try from lowest to highest; pick the lowest that finishes within availMins + 10
  const TARGET_MARGIN = 10; // max overrun in minutes

  let chosen = null;
  let chosenMins = null;
  let chosenFinalPct = null;

  for (const mode of MODES) {
    const totalMins = minutesForRange(socPct, 100, mode.key);
    if (totalMins <= availMins + TARGET_MARGIN) {
      chosen = mode;
      chosenMins = totalMins;
      chosenFinalPct = 100;
      break;
    }
  }

  // If even MAX doesn't reach 100%, calculate what % MAX achieves in availMins
  if (!chosen) {
    // Use MAX and compute reachable %
    const maxMode = MODES[MODES.length - 1];
    chosen = maxMode;
    // Binary search for reachable %
    let lo = socPct, hi = 100, best = socPct;
    for (let i = 0; i < 20; i++) {
      const mid = (lo + hi) / 2;
      const m = minutesForRange(socPct, mid, maxMode.key);
      if (m <= availMins) { best = mid; lo = mid; }
      else { hi = mid; }
    }
    chosenFinalPct = Math.floor(best);
    chosenMins = minutesForRange(socPct, chosenFinalPct, maxMode.key);
  }

  // Build switcher buttons
  buildSwitcher(socPct, availMins, chosen.amps);

  // Render chosen mode
  renderResult(chosen, socPct, startTime, availMins, false);

  const sec = document.getElementById('resultSection');
  sec.classList.remove('visible');
  void sec.offsetWidth;
  sec.classList.add('visible');
  sec.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ─── BUILD SWITCHER ──────────────────────────────────────────────────────────
function buildSwitcher(socPct, availMins, recommendedAmps) {
  const row = document.getElementById('switcherRow');
  row.innerHTML = '';
  MODES.forEach(mode => {
    const btn = document.createElement('button');
    btn.className = 'switcher-btn' +
      (mode.amps === recommendedAmps ? ' active' : '') +
      (mode.amps === recommendedAmps ? ' recommended' : '');
    btn.innerHTML = `<span class="btn-amp">${mode.amps}A</span><span class="btn-kw">${mode.kw} kW</span>`;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.switcher-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const startTime = document.getElementById('startTime').value;
      renderResult(mode, socPct, startTime, availMins, mode.amps !== recommendedAmps);
    });
    row.appendChild(btn);
  });
}

// ─── RENDER RESULT ───────────────────────────────────────────────────────────
function renderResult(chosen, socPct, startTime, availMins, isManual) {
  const connLabels = { 6:'Enchufe antiguo', 8:'Enchufe doméstico', 10:'Base / Schuko', 16:'Wallbox estándar', 30:'Wallbox máximo' };

  // Compute final % and time
  let chosenMins, chosenFinalPct;
  const totalTo100 = minutesForRange(socPct, 100, chosen.key);
  if (totalTo100 <= availMins + 10) {
    chosenMins = totalTo100;
    chosenFinalPct = 100;
  } else {
    let lo = socPct, hi = 100, best = socPct;
    for (let i = 0; i < 20; i++) {
      const mid = (lo + hi) / 2;
      const m = minutesForRange(socPct, mid, chosen.key);
      if (m <= availMins) { best = mid; lo = mid; } else { hi = mid; }
    }
    chosenFinalPct = Math.floor(best);
    chosenMins = minutesForRange(socPct, chosenFinalPct, chosen.key);
  }

  const finishTime = addMins(startTime, chosenMins);
  const margin = Math.round(availMins - chosenMins);
  const reachable = chosenFinalPct >= 100;

  // Header
  document.getElementById('resIntensity').innerHTML = `${chosen.amps}<span> A</span>`;
  document.getElementById('resIntensityLabel').textContent = isManual ? 'Intensidad seleccionada' : 'Intensidad recomendada';
  document.getElementById('resPower').textContent = `≈ ${chosen.kw} kW · ${connLabels[chosen.amps] || ''}`;

  // Tiles
  const fpEl = document.getElementById('resFinalPct');
  fpEl.textContent = reachable ? '100 %' : `${chosenFinalPct} %`;
  fpEl.className = 'result-tile-value ' + (reachable ? 'ok' : 'warn');

  document.getElementById('resTime').textContent = fmtMins(chosenMins);
  document.getElementById('resFinish').textContent = finishTime;

  const marginEl = document.getElementById('resMargin');
  if (margin >= 0) {
    marginEl.textContent = `+${margin} min`;
    marginEl.className = 'result-tile-value ok';
  } else {
    marginEl.textContent = `${margin} min`;
    marginEl.className = 'result-tile-value ' + (Math.abs(margin) <= 10 ? 'warn' : 'error');
  }

  // Notice
  const noticeEl = document.getElementById('resNotice');
  const endTime = document.getElementById('endTime').value;
  if (!reachable) {
    noticeEl.className = 'notice error';
    noticeEl.textContent = `⚠️ A ${chosen.amps}A solo llegarás al ${chosenFinalPct}% a las ${endTime}. Necesitas más tiempo o una intensidad mayor.`;
  } else if (chosen.amps <= 8) {
    noticeEl.className = 'notice warn';
    noticeEl.textContent = `⚠️ Intensidad muy baja. Llegas al 100% a las ${finishTime} pero con poco margen. Si puedes, sube a 10A o 16A.`;
  } else {
    noticeEl.className = 'notice info';
    noticeEl.textContent = `✅ A ${chosen.amps}A llegas al 100% a las ${finishTime}, ${margin >= 0 ? `${margin} min antes` : `${Math.abs(margin)} min después`} de tu objetivo. Los tiempos del tramo 90–100% ya incluyen el buffer de balanceo.`;
  }

  // Detail table
  const phaseBreaks = [
    { label: `${socPct}% → 90%`,       from: socPct, to: 90  },
    { label: '90% → 100% ⚡ balanceo',  from: 90,     to: 100 },
  ].filter(p => p.from < p.to && p.from < chosenFinalPct);

  let rows = '';
  for (const p of phaseBreaks) {
    const to = Math.min(p.to, chosenFinalPct);
    if (p.from >= to) continue;
    const mins = minutesForRange(p.from, to, chosen.key);
    rows += `<tr><td>${p.label}</td><td>${fmtMins(mins)}</td></tr>`;
  }
  document.getElementById('resDetail').innerHTML = rows;
}

function showError(msg) {
  const noticeEl = document.getElementById('resNotice');
  noticeEl.className = 'notice error';
  noticeEl.textContent = msg;
  document.getElementById('resultSection').classList.add('visible');
}

initTime();
</script>
